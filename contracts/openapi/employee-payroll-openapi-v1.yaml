        '200': {description: Audit history, content: {application/json: {schema: {type: array, items: {$ref: '#/schemas/AuditEvent'}}}}}
  LifecycleLineageCollection:
    get:
      tags: [Employee Payroll]
      operationId: listPayrollLifecycleLineage
