        '200': {description: Audit history, content: {application/json: {schema: {type: array, items: {$ref: '#/schemas/AuditEvent'}}}}}

schemas:
  Problem:
    type: object
    properties:
      type: {type: string, format: uri}
      title: {type: string}
      status: {type: integer}
      detail: {type: string}
      instance: {type: string, format: uri-reference}
  AuditEvent:
    type: object
    additionalProperties: false
    required:
    - id
    - occurredAt
    - actor
    - action
    - objectType
    - objectId
    - correlationId
    properties:
      id: {type: string, format: uuid}
      occurredAt: {type: string, format: date-time}
      actor: {type: string}
      action: {type: string}
      objectType: {type: string}
      objectId: {type: string, format: uuid}
      correlationId: {type: string, format: uuid}
      beforeState: {type: [string, 'null']}
      afterState: {type: [string, 'null']}
      metadata: {type: [string, 'null']}
  PayrollRelationshipWrite:
    type: object
    additionalProperties: false
    required: [legalEntityVersionId, relationshipStart]
    properties:
      externalEmployeeId:
        type: [string, 'null']
        maxLength: 100
        description: Required when creating the stable relationship identity.
      employeeNumber:
        type: [string, 'null']
        maxLength: 60
        description: Required when creating the stable relationship identity.
      legalEntityVersionId: {type: string, format: uuid}
      payrollStatutoryUnitVersionId: {type: [string, 'null'], format: uuid}
      aggregationBoundaryKey: {type: [string, 'null'], maxLength: 120}
      relationshipStart: {type: string, format: date}
      relationshipEnd: {type: [string, 'null'], format: date}
  PayrollRelationshipEndDate:
    type: object
    additionalProperties: false
    required: [relationshipEnd]
    properties:
      relationshipEnd: {type: string, format: date}
  PayrollRelationship:
    type: object
    additionalProperties: false
    required:
    - identityId
    - externalEmployeeId
    - employeeNumber
    - identityStatus
    - versionId
    - versionSequence
    - versionNo
    - legalEntityVersionId
    - relationshipStart
    - approvalStatus
    - superseded
    properties:
      identityId: {type: string, format: uuid}
      externalEmployeeId: {type: string}
      employeeNumber: {type: string}
      identityStatus: {type: string, enum: [ACTIVE, INACTIVE]}
      versionId: {type: string, format: uuid}
      versionSequence: {type: integer, minimum: 1}
      versionNo: {type: integer, format: int64, minimum: 0}
      legalEntityVersionId: {type: string, format: uuid}
      payrollStatutoryUnitVersionId: {type: [string, 'null'], format: uuid}
      aggregationBoundaryKey: {type: [string, 'null'], maxLength: 120}
      countryCode: {type: string, pattern: '^[A-Z]{2}$'}
      employerCurrency: {type: string, pattern: '^[A-Z]{3}$'}
      relationshipStart: {type: string, format: date}
      relationshipEnd: {type: [string, 'null'], format: date}
      approvalStatus: {type: string, enum: [DRAFT, APPROVED, REJECTED]}
      supersedesVersionId: {type: [string, 'null'], format: uuid}
      superseded: {type: boolean}
  PayrollAssignmentWrite:
    type: object
    additionalProperties: false
    required:
    - payrollRelationshipVersionId
    - establishmentVersionId
    - assignmentStart
    properties:
      payrollRelationshipId:
        type: [string, 'null']
        format: uuid
        description: Required when creating the stable assignment identity.
      assignmentNumber:
        type: [string, 'null']
        maxLength: 60
        description: Required when creating the stable assignment identity.
      payrollRelationshipVersionId: {type: string, format: uuid}
      establishmentVersionId: {type: string, format: uuid}
      sourceWorkAssignmentRef: {type: [string, 'null'], maxLength: 160}
      payrollRole: {type: [string, 'null'], enum: [PRIMARY, SECONDARY, null]}
      payrollEligibilityFrom: {type: [string, 'null'], format: date}
      payrollEligibilityTo: {type: [string, 'null'], format: date}
      assignmentStart: {type: string, format: date}
      assignmentEnd: {type: [string, 'null'], format: date}
  PayrollAssignmentEndDate:
    type: object
    additionalProperties: false
    required: [assignmentEnd]
    properties:
      assignmentEnd: {type: string, format: date}
  PayrollAssignment:
    type: object
    additionalProperties: false
    required:
    - identityId
    - payrollRelationshipId
    - assignmentNumber
    - identityStatus
    - versionId
    - versionSequence
    - versionNo
    - payrollRelationshipVersionId
    - establishmentVersionId
    - assignmentStart
    - approvalStatus
    - superseded
    properties:
      identityId: {type: string, format: uuid}
      payrollRelationshipId: {type: string, format: uuid}
      assignmentNumber: {type: string}
      identityStatus: {type: string, enum: [ACTIVE, INACTIVE]}
      versionId: {type: string, format: uuid}
      versionSequence: {type: integer, minimum: 1}
      versionNo: {type: integer, format: int64, minimum: 0}
      payrollRelationshipVersionId: {type: string, format: uuid}
      establishmentVersionId: {type: string, format: uuid}
      sourceWorkAssignmentRef: {type: [string, 'null'], maxLength: 160}
      payrollRole: {type: [string, 'null'], enum: [PRIMARY, SECONDARY, null]}
      payrollEligibilityFrom: {type: [string, 'null'], format: date}
      payrollEligibilityTo: {type: [string, 'null'], format: date}
      assignmentStart: {type: string, format: date}
      assignmentEnd: {type: [string, 'null'], format: date}
      approvalStatus: {type: string, enum: [DRAFT, APPROVED, REJECTED]}
      supersedesVersionId: {type: [string, 'null'], format: uuid}
      superseded: {type: boolean}
  EmployeePayrollProfileWrite:
    type: object
    additionalProperties: false
    required: [payrollRelationshipId]
    properties:
      payrollRelationshipId: {type: string, format: uuid}
      currency: {type: [string, 'null'], const: INR, default: INR}
  EmployeePayrollProfileStatusWrite:
    type: object
    additionalProperties: false
    required: [payrollStatus]
    properties:
      payrollStatus:
        type: string
        enum: [INCOMPLETE, READY, ON_HOLD, INACTIVE]
  EmployeePayrollProfile:
    type: object
    additionalProperties: false
    required:
    - id
    - payrollRelationshipId
    - employeeNumber
    - currency
    - payrollStatus
    - versionNo
    properties:
      id: {type: string, format: uuid}
      payrollRelationshipId: {type: string, format: uuid}
      employeeNumber: {type: string}
      currency: {type: string, const: INR}
      payrollStatus:
        type: string
        enum: [INCOMPLETE, READY, ON_HOLD, INACTIVE]
      versionNo: {type: integer, format: int64, minimum: 0}
  PayGroupAssignmentWrite:
    type: object
    additionalProperties: false
    required:
    - payrollAssignmentVersionId
    - payGroupVersionId
    - effectiveFrom
    properties:
      payrollAssignmentVersionId: {type: string, format: uuid}
      payGroupVersionId: {type: string, format: uuid}
      effectiveFrom: {type: string, format: date}
      effectiveTo: {type: [string, 'null'], format: date}
      impactAssessmentThrough: {type: [string, 'null'], format: date}
  EffectiveEndDate:
    type: object
    additionalProperties: false
    required: [effectiveTo]
    properties:
      effectiveTo: {type: string, format: date}
  PayGroupAssignment:
    type: object
    additionalProperties: false
    required:
    - id
    - payrollAssignmentVersionId
    - payGroupVersionId
    - effectiveFrom
    - approvalStatus
    - superseded
    - versionNo
    properties:
      id: {type: string, format: uuid}
      payrollAssignmentVersionId: {type: string, format: uuid}
      payGroupVersionId: {type: string, format: uuid}
      effectiveFrom: {type: string, format: date}
      effectiveTo: {type: [string, 'null'], format: date}
      impactAssessmentThrough: {type: [string, 'null'], format: date}
      impactedPeriodCount: {type: integer, minimum: 0}
      approvalStatus: {type: string, enum: [DRAFT, APPROVED, REJECTED]}
      supersedesAssignmentId: {type: [string, 'null'], format: uuid}
      superseded: {type: boolean}
      versionNo: {type: integer, format: int64, minimum: 0}
  SalaryAssignmentWrite:
    type: object
    additionalProperties: false
    required:
    - payrollAssignmentVersionId
    - salaryStructureVersionId
    - effectiveFrom
    oneOf:
    - required: [monthlyAmount]
    - required: [targetType, targetValue, targetFrequency, currency, sourceCompensationEventId]
    properties:
      payrollAssignmentVersionId: {type: string, format: uuid}
      salaryStructureVersionId: {type: string, format: uuid}
      monthlyAmount: {type: [number, 'null'], minimum: 0, multipleOf: 0.0001}
      targetType: {type: [string, 'null'], maxLength: 40}
      targetValue: {type: [number, 'null'], minimum: 0, multipleOf: 0.0001}
      targetFrequency: {type: [string, 'null'], enum: [ANNUAL, MONTHLY, HOURLY, DAILY, null]}
      currency: {type: [string, 'null'], pattern: '^[A-Z]{3}$'}
      sourceCompensationEventId: {type: [string, 'null'], format: uuid}
      effectiveFrom: {type: string, format: date}
      effectiveTo: {type: [string, 'null'], format: date}
  SalaryAssignment:
    type: object
    additionalProperties: false
    required:
    - id
    - payrollAssignmentVersionId
    - salaryStructureVersionId
    - monthlyAmount
    - currency
    - effectiveFrom
    - approvalStatus
    - superseded
    - versionNo
    properties:
      id: {type: string, format: uuid}
      payrollAssignmentVersionId: {type: string, format: uuid}
      salaryStructureVersionId: {type: string, format: uuid}
      monthlyAmount: {type: [number, 'null'], minimum: 0, multipleOf: 0.0001}
      targetType: {type: [string, 'null'], maxLength: 40}
      targetValue: {type: [number, 'null'], minimum: 0, multipleOf: 0.0001}
      targetFrequency: {type: [string, 'null'], enum: [ANNUAL, MONTHLY, HOURLY, DAILY, null]}
      currency: {type: string, pattern: '^[A-Z]{3}$'}
      sourceCompensationEventId: {type: [string, 'null'], format: uuid}
      effectiveFrom: {type: string, format: date}
      effectiveTo: {type: [string, 'null'], format: date}
      approvalStatus: {type: string, enum: [DRAFT, APPROVED, REJECTED]}
      supersedesAssignmentId: {type: [string, 'null'], format: uuid}
      superseded: {type: boolean}
      versionNo: {type: integer, format: int64, minimum: 0}

  PayGroupAssignmentImpact:
    type: object
    additionalProperties: false
    properties:
      payPeriodId: {type: string, format: uuid}
      periodCode: {type: string}
      periodStart: {type: string, format: date}
      periodEnd: {type: string, format: date}
      reasonCode: {type: string, const: EFFECTIVE_RANGE_OVERLAP}
  CompensationChangeWrite:
    type: object
    additionalProperties: false
    required: [payrollAssignmentId, eventType, effectiveDate, reason]
    properties:
      payrollAssignmentId: {type: string, format: uuid}
      eventType: {type: string, enum: [PROSPECTIVE, CURRENT_PERIOD, RETROSPECTIVE, CORRECTION, REVERSAL]}
      effectiveDate: {type: string, format: date}
      sourceEventId: {type: [string, 'null'], format: uuid}
      reason: {type: string, minLength: 1, maxLength: 500}
  CompensationChangeAssessment:
    type: object
    additionalProperties: false
    required: [assessmentThrough]
    properties:
      assessmentThrough: {type: string, format: date}
  CompensationChange:
    type: object
    additionalProperties: false
    properties:
      id: {type: string, format: uuid}
      payrollAssignmentId: {type: string, format: uuid}
      eventType: {type: string}
      effectiveDate: {type: string, format: date}
      sourceEventId: {type: [string, 'null'], format: uuid}
      reason: {type: string}
      assessmentThrough: {type: [string, 'null'], format: date}
      impactAssessedAt: {type: [string, 'null'], format: date-time}
      impactAssessedBy: {type: [string, 'null']}
      impactedPeriodCount: {type: integer, minimum: 0}
      approvalStatus: {type: string, enum: [DRAFT, APPROVED, REJECTED]}
      approvedAt: {type: [string, 'null'], format: date-time}
      approvedBy: {type: [string, 'null']}
      versionNo: {type: integer, format: int64, minimum: 0}
  CompensationChangeImpact:
    type: object
    additionalProperties: false
    properties:
      payPeriodId: {type: string, format: uuid}
      periodCode: {type: string}
      periodStart: {type: string, format: date}
      periodEnd: {type: string, format: date}
      reasonCode: {type: string, const: EFFECTIVE_DATE_OVERLAP}
  EmployeeComponentOverrideWrite:
    type: object
    additionalProperties: false
    required: [payrollAssignmentVersionId, salaryAssignmentId, salaryStructureLineId, componentVersionId, overrideKind, overrideValue, effectiveFrom]
    properties:
      payrollAssignmentVersionId: {type: string, format: uuid}
