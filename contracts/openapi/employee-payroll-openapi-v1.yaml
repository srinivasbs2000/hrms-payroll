      responses:
        '200': {description: Employee component overrides, content: {application/json: {schema: {type: array, items: {$ref: '#/schemas/EmployeeComponentOverride'}}}}}
    post:
      tags: [Employee Payroll]
      operationId: createEmployeeComponentOverride
      x-permission: employee-payroll.component-override.create
