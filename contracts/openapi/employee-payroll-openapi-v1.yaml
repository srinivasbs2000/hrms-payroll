      responses:
        '200': {description: Successor override draft, content: {application/json: {schema: {$ref: '#/schemas/EmployeeComponentOverride'}}}}
        '409': {$ref: '#/responses/Conflict'}
  ComponentOverrideApproval:
    parameters:
    - name: id
      in: path
      required: true
