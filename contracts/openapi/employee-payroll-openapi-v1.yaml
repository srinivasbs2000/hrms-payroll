    get:
      tags: [Employee Payroll]
      operationId: getCompensationChangeImpact
      x-permission: employee-payroll.compensation-change.read
      responses:
        '200': {description: Affected pay periods, content: {application/json: {schema: {type: array, items: {$ref: '#/schemas/CompensationChangeImpact'}}}}}
  CompensationChangeApproval:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      tags: [Employee Payroll]
      operationId: approveCompensationChange
      x-permission: employee-payroll.compensation-change.approve
      parameters:
