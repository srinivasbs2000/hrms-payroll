      responses:
        '200': {description: Approved compensation change, content: {application/json: {schema: {$ref: '#/schemas/CompensationChange'}}}}
        '409': {$ref: '#/responses/Conflict'}
  CompensationChangeAudit:
    parameters:
    - name: id
      in: path
