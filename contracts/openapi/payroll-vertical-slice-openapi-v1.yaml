        tags: [Organisation]
        summary: List effective payroll jurisdictions
        operationId: listPayrollJurisdictions
        x-permission: organisation.read
        parameters:
        - $ref: '#/components/parameters/AsOf'
        responses:
          '200':
            description: Effective payroll jurisdictions
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/JrfPayrollJurisdictionView'
          '401': {$ref: '#/components/responses/Problem'}
          '403': {$ref: '#/components/responses/Problem'}
      post:
        tags: [Organisation]
        summary: Create a payroll-jurisdiction identity and draft version
        operationId: createPayrollJurisdiction
        x-permission: organisation.create
        parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JrfPayrollJurisdictionCreateRequest'
        responses:
          '201':
            description: Jurisdiction created
            headers:
              ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/JrfPayrollJurisdictionView'
          '400': {$ref: '#/components/responses/Problem'}
          '401': {$ref: '#/components/responses/Problem'}
          '403': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
          '422': {$ref: '#/components/responses/Problem'}
    JrfPayrollJurisdictionIdentity:
      parameters:
      - $ref: '#/components/parameters/IdentityId'
      - $ref: '#/components/parameters/CorrelationId'
      get:
        tags: [Organisation]
        summary: Read the effective payroll-jurisdiction version
        operationId: getPayrollJurisdiction
        x-permission: organisation.read
        parameters:
        - $ref: '#/components/parameters/AsOf'
        responses:
          '200':
            description: Effective jurisdiction
            headers:
              ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/JrfPayrollJurisdictionView'
          '401': {$ref: '#/components/responses/Problem'}
          '403': {$ref: '#/components/responses/Problem'}
          '404': {$ref: '#/components/responses/Problem'}
