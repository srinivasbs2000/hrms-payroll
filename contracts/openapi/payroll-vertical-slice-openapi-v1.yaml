  # P5-CCF-01 G02 component formula/rate/rounding/proration controls - critical review hardened
  /pay-components/formula-validation:
    post:
      tags: [Compensation]
      summary: Validate and canonicalize a restricted component formula
      operationId: validatePayComponentFormula
      x-permission: compensation.component.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expression]
              properties:
                expression: {type: string, minLength: 1, maxLength: 1000}
                calculationPhase: {type: string, enum: [INPUT, PRE_TAX, TAX, POST_TAX, NET], default: PRE_TAX}
                resultContract: {type: string, enum: [DECIMAL], default: DECIMAL}
      responses:
        '200':
          description: Canonical restricted-formula validation result
          content:
            application/json:
              schema:
                type: object
                required: [canonicalExpression, dependencies, calculationPhase, resultContract, formulaFingerprint]
                properties:
                  canonicalExpression: {type: string}
                  dependencies: {type: array, items: {type: string}}
                  calculationPhase: {type: string, enum: [INPUT, PRE_TAX, TAX, POST_TAX, NET]}
                  resultContract: {type: string, const: DECIMAL}
                  formulaFingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

