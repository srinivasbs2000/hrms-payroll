    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Organisation]
      summary: Submit an employer bank-account draft for verification
      operationId: submitEmployerBankAccountVersion
      x-permission: organisation.bank-account.write
      responses:
        '200':
          description: Submitted employer bank-account version
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions/{versionId}/verify:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Organisation]
      summary: Independently verify an employer bank-account version
      operationId: verifyEmployerBankAccountVersion
      x-permission: organisation.bank-account.verify
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaEvidenceRequest'}
      responses:
        '200':
          description: Verified employer bank-account version
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions/{versionId}/request-approval:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Organisation]
      summary: Request final approval for a verified employer bank-account version
      operationId: requestEmployerBankAccountApproval
      x-permission: organisation.bank-account.verify
      responses:
        '200':
          description: Employer bank-account version awaiting approval
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions/{versionId}/approve:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Organisation]
      summary: Give independent final approval to an employer bank-account version
      operationId: approveEmployerBankAccountVersion
      x-permission: organisation.bank-account.approve
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaEvidenceRequest'}
      responses:
        '200':
          description: Approved employer bank-account version
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions/{versionId}/reject:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Organisation]
      summary: Reject an employer bank-account version
      operationId: rejectEmployerBankAccountVersion
      x-permission: organisation.bank-account.approve
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaRejectRequest'}
      responses:
        '200':
          description: Rejected employer bank-account version
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions/{versionId}/suspend:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Organisation]
      summary: Suspend an approved employer bank-account version
      operationId: suspendEmployerBankAccountVersion
      x-permission: organisation.bank-account.approve
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaSuspendRequest'}
      responses:
        '200':
          description: Suspended employer bank-account version
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions/{versionId}/reveal:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
    - $ref: '#/components/parameters/CorrelationId'
    post:
      tags: [Organisation]
      summary: Privileged audited reveal of an employer bank-account number
      operationId: revealEmployerBankAccountNumber
      x-permission: organisation.bank-account.reveal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaRevealRequest'}
      responses:
        '200':
          description: Privileged employer bank-account reveal; response must not be cached
          headers:
            Cache-Control:
              description: Prevent storage of the revealed account number
              schema: {type: string, const: no-store}
            Pragma:
              description: Legacy no-cache protection for the revealed account number
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountRevealView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
