      x-permission: organisation.signatory.read
      parameters:
      - name: ownerKind
        in: query
        required: false
        schema: {type: string, enum: [LEGAL_ENTITY, PAYROLL_STATUTORY_UNIT]}
      - name: ownerId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Effective authorised signatories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FbaAuthorisedSignatoryView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Organisation]
      summary: Create an authorised-signatory identity and draft version
      operationId: createAuthorisedSignatory
      x-permission: organisation.signatory.write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaAuthorisedSignatoryCreateRequest'}
      responses:
        '201':
          description: Authorised signatory created
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaAuthorisedSignatoryView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /authorised-signatories/{identityId}:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [Organisation]
      summary: Read the effective authorised-signatory version
      operationId: getAuthorisedSignatory
      x-permission: organisation.signatory.read
      parameters:
      - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Effective authorised signatory
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
