components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8081/realms/payroll/.well-known/openid-configuration
  parameters:
    P5A3ValidationId:
      name: validationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Caller-supplied UUID used for request, log, event and error correlation. A value is generated when omitted or invalid.
      schema:
        type: string
        format: uuid
    CalendarId:
      name: calendarId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 120
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AsOf:
      name: asOf
      in: query
      required: false
      description: Effective date; defaults to the application clock date.
      schema: {type: string, format: date}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Numeric version ETag used for optimistic concurrency.
      schema: {type: string, pattern: '^(W/)?"?[0-9]+"?$'}
  pathItems:
    JrfPayrollJurisdictionCollection:
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
