openapi: 3.1.0
info:
  title: HRMS Payroll Vertical Slice API
  version: 1.0.0
  description: Organisation-to-statutory-ledger implementation contract with employer banking
    and authorised-signatory foundations. Tax filing, accounting, retro, final settlement and payment execution remain outside this contract.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /api/v1
security:
- oidc: []
tags:
- name: Organisation
  description: Employer hierarchy and establishment setup.
- name: Approval Authority
  description: Entity/PSU-scoped application approver assignments and bounded delegation.
- name: Calendar
  description: Payroll calendars, frequencies, periods, lifecycle and pay groups.
- name: Compensation
  description: Pay components and salary structures.
- name: Employee Payroll
  description: Payroll relationships, assignments and salary assignment.
- name: Payroll Operations
  description: Regular cycle, population and sealed inputs.
- name: Calculation
  description: Deterministic gross-to-net results and trace.
- name: Statutory
  description: Statutory evaluation, posting, balances and reconciliation.
- name: Documents
  description: Draft payslip generation and retrieval.
paths:
