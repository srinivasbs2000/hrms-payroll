        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogueRetirement'}}}}
        responses:
          '200': {$ref: '#/components/responses/PayrollBaseVersion'}
          '401': {$ref: '#/components/responses/Unauthorized'}
          '403': {$ref: '#/components/responses/Forbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/Conflict'}
    PayrollBaseMemberships:
      parameters:
      - $ref: '#/components/parameters/IdentityId'
      - $ref: '#/components/parameters/CorrelationId'
      get:
        operationId: listComponentBaseMemberships
        tags: [Compensation]
        summary: Read effective or complete append-only component membership
        x-permission: compensation.base.read
        parameters:
        - $ref: '#/components/parameters/AsOf'
        - {name: includeHistory, in: query, required: false, schema: {type: boolean, default: false}}
        responses:
          '200': {description: Component membership, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ComponentBaseMembership'}}}}}
          '401': {$ref: '#/components/responses/Unauthorized'}
          '403': {$ref: '#/components/responses/Forbidden'}
      post:
        operationId: createComponentBaseMembership
        tags: [Compensation]
        summary: Add an exact component-version to base-version membership draft
        x-permission: compensation.base.membership.create
        parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        requestBody: {$ref: '#/components/requestBodies/ComponentBaseMembershipWriteRequest'}
        responses:
          '201': {$ref: '#/components/responses/ComponentBaseMembership'}
          '401': {$ref: '#/components/responses/Unauthorized'}
          '403': {$ref: '#/components/responses/Forbidden'}
          '409': {$ref: '#/components/responses/Conflict'}
          '422': {$ref: '#/components/responses/UnprocessableEntity'}
    PayrollBaseMembershipCorrection:
      parameters:
      - $ref: '#/components/parameters/IdentityId'
      - {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: '#/components/parameters/CorrelationId'
      post:
        operationId: correctComponentBaseMembership
        tags: [Compensation]
        summary: Supersede an eligible future membership draft
        x-permission: compensation.base.membership.correct
        parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        requestBody: {$ref: '#/components/requestBodies/ComponentBaseMembershipWriteRequest'}
        responses:
          '200': {$ref: '#/components/responses/ComponentBaseMembership'}
          '401': {$ref: '#/components/responses/Unauthorized'}
          '403': {$ref: '#/components/responses/Forbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/Conflict'}
    PayrollBaseMembershipEndDate:
      parameters:
      - $ref: '#/components/parameters/IdentityId'
      - {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: '#/components/parameters/CorrelationId'
      post:
        operationId: endDateComponentBaseMembership
        tags: [Compensation]
        summary: End-date a membership through optimistic concurrency
        x-permission: compensation.base.membership.end-date
        parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EffectiveEndDate'}}}}
        responses:
          '200': {$ref: '#/components/responses/ComponentBaseMembership'}
          '401': {$ref: '#/components/responses/Unauthorized'}
          '403': {$ref: '#/components/responses/Forbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/Conflict'}
    PayrollBaseMembershipApproval:
      parameters:
      - $ref: '#/components/parameters/IdentityId'
      - {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: '#/components/parameters/CorrelationId'
      post:
        operationId: approveComponentBaseMembership
        tags: [Compensation]
        summary: Approve exact membership through maker-checker
        x-permission: compensation.base.membership.approve
        parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        responses:
          '200': {$ref: '#/components/responses/ComponentBaseMembership'}
          '401': {$ref: '#/components/responses/Unauthorized'}
          '403': {$ref: '#/components/responses/Forbidden'}
          '404': {$ref: '#/components/responses/NotFound'}
          '409': {$ref: '#/components/responses/Conflict'}
    PayrollBaseAudit:
      parameters:
      - $ref: '#/components/parameters/IdentityId'
      - $ref: '#/components/parameters/CorrelationId'
      get:
        operationId: listPayrollBaseAuditEvents
        tags: [Compensation]
        summary: Read immutable audit evidence for a payroll-base identity
        x-permission: audit.read
        responses:
          '200': {description: Audit history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}}}}
          '401': {$ref: '#/components/responses/Unauthorized'}
          '403': {$ref: '#/components/responses/Forbidden'}
