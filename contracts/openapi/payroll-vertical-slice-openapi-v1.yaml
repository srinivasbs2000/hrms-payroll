  /employer-bank-accounts:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [Organisation]
      summary: List effective employer bank accounts with masked account numbers
      operationId: listEmployerBankAccounts
      x-permission: organisation.bank-account.read
      parameters:
      - name: ownerKind
        in: query
        required: false
        schema: {type: string, enum: [LEGAL_ENTITY, PAYROLL_STATUTORY_UNIT]}
      - name: ownerId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: currencyCode
        in: query
        required: false
        schema: {type: string, pattern: '^[A-Z]{3}$'}
      - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Effective masked employer bank accounts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Organisation]
      summary: Create an employer bank-account identity and draft version
      operationId: createEmployerBankAccount
      x-permission: organisation.bank-account.write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaEmployerBankAccountCreateRequest'}
      responses:
        '201':
          description: Employer bank account created
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [Organisation]
      summary: Read the effective employer bank-account version
      operationId: getEmployerBankAccount
      x-permission: organisation.bank-account.read
      parameters:
      - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Effective masked employer bank account
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [Organisation]
      summary: Read employer bank-account version history
      operationId: getEmployerBankAccountHistory
      x-permission: organisation.bank-account.read
      responses:
        '200':
          description: Complete employer bank-account version history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Organisation]
      summary: Add a successor employer bank-account draft version
      operationId: addEmployerBankAccountVersion
      x-permission: organisation.bank-account.write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaEmployerBankAccountVersionWriteRequest'}
      responses:
        '201':
          description: Employer bank-account version created
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaEmployerBankAccountView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /employer-bank-accounts/{identityId}/versions/{versionId}/submit:
