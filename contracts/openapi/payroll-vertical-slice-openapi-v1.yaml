        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Organisation]
      summary: Add a successor authorised-signatory draft version
      operationId: addAuthorisedSignatoryVersion
      x-permission: organisation.signatory.write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FbaAuthorisedSignatoryVersionWriteRequest'}
      responses:
        '201':
          description: Authorised-signatory version created
          headers:
            ETag: {description: Numeric optimistic-concurrency version, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FbaAuthorisedSignatoryView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /authorised-signatories/{identityId}/versions/{versionId}/submit:
    parameters:
    - $ref: '#/components/parameters/IdentityId'
    - $ref: '#/components/parameters/VersionId'
