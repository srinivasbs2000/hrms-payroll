parameters:
  CycleId:
    name: cycleId
    in: path
    required: true
    schema:
      $ref: '#/schemas/Uuid'
  CorrelationId:
    name: X-Correlation-ID
    in: header
    required: false
    schema:
      $ref: '#/schemas/Uuid'
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    schema:
      type: string
      minLength: 8
      maxLength: 120
  IfMatch:
    name: If-Match
    in: header
    required: true
    schema:
      type: string
      pattern: ^(W/\s*)?"?[0-9]+"?$
  IdentityId:
    name: identityId
    in: path
    required: true
    schema:
      $ref: '#/schemas/Uuid'
  VersionId:
    name: versionId
    in: path
    required: true
    schema:
      $ref: '#/schemas/Uuid'
  AsOf:
    name: asOf
    in: query
    required: false
    schema:
      type: string
      format: date
headers:
  ETag:
    description: Numeric payroll-cycle version
    schema:
      type: string
responses:
  Unauthorized:
    description: Authentication is required
  Forbidden:
    description: Required permission is absent
  Problem:
    description: RFC 9457 problem response
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/Problem'
pathItems:
  RegistrationTypeCollection:
    get:
      tags: [Statutory]
      summary: List effective statutory-registration types
      operationId: listStatutoryRegistrationTypes
      x-permission: statutory-registration.read
      parameters:
      - $ref: '#/parameters/AsOf'
      responses:
        '200':
          description: Effective registration types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/RegistrationTypeView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
    post:
      tags: [Statutory]
      summary: Create a registration-type identity and draft version
      operationId: createStatutoryRegistrationType
      x-permission: statutory-registration-type.write
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegistrationTypeCreateRequest'
      responses:
        '201':
          description: Registration type created
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/RegistrationTypeView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationTypeIdentity:
    parameters:
    - $ref: '#/parameters/IdentityId'
    get:
      tags: [Statutory]
      summary: Read the effective statutory-registration type
      operationId: getStatutoryRegistrationType
      x-permission: statutory-registration.read
      parameters:
      - $ref: '#/parameters/AsOf'
      responses:
        '200':
          description: Effective registration type
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/RegistrationTypeView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
  RegistrationTypeVersions:
    parameters:
    - $ref: '#/parameters/IdentityId'
    post:
      tags: [Statutory]
      summary: Add a statutory-registration-type draft version
      operationId: addStatutoryRegistrationTypeVersion
      x-permission: statutory-registration-type.write
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegistrationTypeVersionWriteRequest'
      responses:
        '201':
          description: Registration-type version created
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/RegistrationTypeView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationTypeApproval:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Approve a statutory-registration-type version
      operationId: approveStatutoryRegistrationTypeVersion
      x-permission: statutory-registration.approve
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      responses:
        '200':
          description: Registration type approved
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/RegistrationTypeView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationCollection:
    get:
      tags: [Statutory]
      summary: List effective statutory registrations
      operationId: listStatutoryRegistrations
      x-permission: statutory-registration.read
      parameters:
      - $ref: '#/parameters/AsOf'
      responses:
        '200':
          description: Effective active or suspended registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryRegistrationView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
    post:
      tags: [Statutory]
      summary: Create a statutory-registration identity and draft version
      operationId: createStatutoryRegistration
      x-permission: statutory-registration.write
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/StatutoryRegistrationCreateRequest'
      responses:
        '201':
          description: Registration created
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationIdentity:
    parameters:
    - $ref: '#/parameters/IdentityId'
    get:
      tags: [Statutory]
      summary: Read the effective statutory registration
      operationId: getStatutoryRegistration
      x-permission: statutory-registration.read
      parameters:
      - $ref: '#/parameters/AsOf'
      responses:
        '200':
          description: Effective registration
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
  RegistrationVersions:
    parameters:
    - $ref: '#/parameters/IdentityId'
    get:
      tags: [Statutory]
      summary: List statutory-registration version history
      operationId: listStatutoryRegistrationVersions
      x-permission: statutory-registration.read
      responses:
        '200':
          description: Registration history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryRegistrationView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
    post:
      tags: [Statutory]
      summary: Add a successor statutory-registration draft version
      operationId: addStatutoryRegistrationVersion
      x-permission: statutory-registration.write
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/StatutoryRegistrationVersionWriteRequest'
      responses:
        '201':
          description: Registration version created
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationSubmission:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Submit a draft statutory registration for verification
      operationId: submitStatutoryRegistration
      x-permission: statutory-registration.write
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      responses:
        '200':
          description: Registration submitted
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationVerification:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Verify a submitted statutory registration
      operationId: verifyStatutoryRegistration
      x-permission: statutory-registration.verify
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegistrationVerificationRequest'
      responses:
        '200':
          description: Registration verified
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationApprovalRequest:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Request final approval for a verified statutory registration
      operationId: requestStatutoryRegistrationApproval
      x-permission: statutory-registration.verify
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      responses:
        '200':
          description: Registration moved to approval pending
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationApproval:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Activate an independently verified statutory registration
      operationId: approveStatutoryRegistration
      x-permission: statutory-registration.approve
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegistrationApprovalRequest'
      responses:
        '200':
          description: Registration activated
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationRejection:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Reject a submitted or approval-pending statutory registration
      operationId: rejectStatutoryRegistration
      x-permission: statutory-registration.approve
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegistrationRejectionRequest'
      responses:
        '200':
          description: Registration rejected
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationSuspension:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Suspend an active statutory registration
      operationId: suspendStatutoryRegistration
      x-permission: statutory-registration.approve
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegistrationSuspensionRequest'
      responses:
        '200':
          description: Registration suspended
          headers:
            ETag: {$ref: '#/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryRegistrationView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
        '409': {$ref: '#/responses/Problem'}
  RegistrationIdentifierReveal:
    parameters:
    - $ref: '#/parameters/IdentityId'
    - $ref: '#/parameters/VersionId'
    post:
      tags: [Statutory]
      summary: Reveal the exact statutory-registration identifier for an authorized compliance operator
      operationId: revealStatutoryRegistrationIdentifier
      x-permission: statutory-registration.identifier.read
      responses:
        '200':
          description: Exact registration identifier; response must not be cached
          headers:
            Cache-Control:
              description: Sensitive response cache policy
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/schemas/RegistrationIdentifierRevealView'
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/Problem'}
  RegistrationReadiness:
    post:
      tags: [Statutory]
      summary: Evaluate bounded jurisdiction-registration foundation readiness
      operationId: evaluateJurisdictionRegistrationReadiness
      x-permission: statutory-registration.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegistrationReadinessRequest'
      responses:
        '200':
          description: Bounded readiness findings
          content:
            application/json:
              schema:
                $ref: '#/schemas/RegistrationReadinessView'
        '400': {$ref: '#/responses/Problem'}
        '401': {$ref: '#/responses/Unauthorized'}
        '403': {$ref: '#/responses/Forbidden'}
  StatutoryEvaluations:
    parameters:
    - $ref: '#/parameters/CycleId'
    - $ref: '#/parameters/CorrelationId'
    post:
      tags:
      - Statutory
      summary: Evaluate the active calculated payroll request
      operationId: evaluateStatutoryPayroll
      x-permission: statutory-evaluation.execute
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/StatutoryEvaluationCommand'
      responses:
        '200':
          description: Completed or idempotently replayed statutory evaluation
          headers:
            ETag:
              $ref: '#/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryEvaluationExecution'
        '400':
          $ref: '#/responses/Problem'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
        '409':
          $ref: '#/responses/Problem'
        '422':
          $ref: '#/responses/Problem'
    get:
      tags:
      - Statutory
      summary: List statutory evaluation requests for a payroll cycle
      operationId: listStatutoryEvaluations
      x-permission: statutory-evaluation.read
      responses:
        '200':
          description: Evaluation request history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryEvaluationRequest'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
  StatutoryPostings:
    parameters:
    - $ref: '#/parameters/CycleId'
    - $ref: '#/parameters/CorrelationId'
    post:
      tags:
      - Statutory
      summary: Post a completed statutory evaluation to the append-only ledger
      operationId: postStatutoryEvaluation
      x-permission: statutory-ledger.post
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/StatutoryLedgerPostingCommand'
      responses:
        '200':
          description: Completed or idempotently replayed ledger posting
          headers:
            ETag:
              $ref: '#/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryLedgerPostingExecution'
        '400':
          $ref: '#/responses/Problem'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
        '409':
          $ref: '#/responses/Problem'
        '422':
          $ref: '#/responses/Problem'
  StatutoryCorrections:
    parameters:
    - $ref: '#/parameters/CycleId'
    - $ref: '#/parameters/CorrelationId'
    post:
      tags:
      - Statutory
      summary: Post a signed statutory correction
      operationId: correctStatutoryLedger
      x-permission: statutory-ledger.correct
      parameters:
      - $ref: '#/parameters/IdempotencyKey'
      - $ref: '#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/StatutoryCorrectionCommand'
      responses:
        '200':
          description: Completed or idempotently replayed correction
          headers:
            ETag:
              $ref: '#/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/schemas/StatutoryCorrectionExecution'
        '400':
          $ref: '#/responses/Problem'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
        '409':
          $ref: '#/responses/Problem'
        '422':
          $ref: '#/responses/Problem'
  StatutoryResults:
    parameters:
    - $ref: '#/parameters/CycleId'
    get:
      tags:
      - Statutory
      summary: List immutable statutory result evidence
      operationId: listStatutoryResults
      x-permission: statutory-evaluation.read
      responses:
        '200':
          description: Statutory result evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryResult'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
  StatutoryLedgerBatches:
    parameters:
    - $ref: '#/parameters/CycleId'
    get:
      tags:
      - Statutory
      summary: List statutory ledger batches
      operationId: listStatutoryLedgerBatches
      x-permission: statutory-ledger.read
      responses:
        '200':
          description: Ledger batch history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryLedgerBatch'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
  StatutoryLedgerEntries:
    parameters:
    - $ref: '#/parameters/CycleId'
    get:
      tags:
      - Statutory
      summary: List append-only statutory ledger entries
      operationId: listStatutoryLedgerEntries
      x-permission: statutory-ledger.read
      responses:
        '200':
          description: Ledger entries ordered by posting
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryLedgerEntry'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
  StatutoryBalanceSnapshots:
    parameters:
    - $ref: '#/parameters/CycleId'
    get:
      tags:
      - Statutory
      summary: List immutable PTD, cycle and YTD balance snapshots
      operationId: listStatutoryBalanceSnapshots
      x-permission: statutory-balance.read
      responses:
        '200':
          description: Balance snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryBalanceSnapshot'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
  StatutoryReconciliations:
    parameters:
    - $ref: '#/parameters/CycleId'
    get:
      tags:
      - Statutory
      summary: List zero-variance statutory reconciliations
      operationId: listStatutoryReconciliations
      x-permission: statutory-reconciliation.read
      responses:
        '200':
          description: Reconciliation evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryReconciliation'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
  StatutoryRemittanceSummaries:
    parameters:
    - $ref: '#/parameters/CycleId'
    get:
      tags:
      - Statutory
      summary: List remittance-ready preparation summaries
      operationId: listStatutoryRemittanceSummaries
      x-permission: statutory-remittance.read
      responses:
        '200':
          description: Preparation summaries; no filing or payment status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/StatutoryRemittanceSummary'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/Problem'
schemas:
  RegistrationOwnerKind:
    type: string
    enum: [LEGAL_ENTITY, PAYROLL_STATUTORY_UNIT, ESTABLISHMENT]
  RegistrationTypeVersionWriteRequest:
    type: object
    additionalProperties: false
    required:
    - name
    - obligationCode
    - authorityCode
    - jurisdictionLevelCode
    - identifierPatternDialect
    - identifierCasePolicy
    - parentRequired
    - ownerKinds
    - effectiveFrom
    properties:
      name: {type: string, minLength: 1, maxLength: 160}
      obligationCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,59}$'}
      authorityCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,59}$'}
      jurisdictionLevelCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,29}$'}
      identifierPattern:
        type: [string, 'null']
        maxLength: 240
        description: JAVA_REGEX_V1 expression evaluated with java.util.regex.Pattern using whole-string matches semantics.
      identifierCasePolicy: {type: string, enum: [UPPER, PRESERVE]}
      parentRequired: {type: boolean}
      parentRegistrationTypeId:
        type: [string, 'null']
        format: uuid
      ownerKinds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/schemas/RegistrationOwnerKind'
      effectiveFrom: {type: string, format: date}
      effectiveTo:
        type: [string, 'null']
        format: date
  RegistrationTypeCreateRequest:
    type: object
    additionalProperties: false
    required: [code, version]
    properties:
      code: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,59}$'}
