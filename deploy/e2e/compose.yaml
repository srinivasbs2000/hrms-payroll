services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payroll}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      PAYROLL_APP_PASSWORD: ${PAYROLL_APP_PASSWORD:?set PAYROLL_APP_PASSWORD}
      PAYROLL_MIGRATOR_PASSWORD: ${PAYROLL_MIGRATOR_PASSWORD:?set PAYROLL_MIGRATOR_PASSWORD}
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-25432}:5432"
    volumes:
      - payroll-e2e-db-v17:/var/lib/postgresql/data
      - ../local/postgres/001_admin_bootstrap.sh:/docker-entrypoint-initdb.d/001_admin_bootstrap.sh:ro
      - ../../database/flyway/bootstrap/001_admin_bootstrap.sql:/bootstrap/001_admin_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-payroll}"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${E2E_KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ../local/keycloak/payroll-realm.json:/opt/keycloak/data/import/payroll-realm.json:ro

volumes:
  payroll-e2e-db-v17:
